<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Normalize -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">

  <title>Admin | Brain Bucket</title>
</head>

<body>
  <nav class="bb-navbar">
    <div class="container bb-topbar">
      <a class="bb-logo-link" href="../index.html" aria-label="Brain Bucket Home"><i class="bi bi-bucket"></i></a>
      <div class="bb-title-wrap">
        <h1 class="bb-title m-0">Brain Bucket</h1>
        <p class="bb-title-tagline mb-0">admin diagnostics</p>
      </div>
      <div class="dropdown">
        <button class="btn btn-outline-dark btn-sm dropdown-toggle bb-profile-chip" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-person-circle me-1" aria-hidden="true"></i>
          <span id="navProfileName">User</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="../index.html">Home</a></li>
          <li><a class="dropdown-item" href="./form.html">Add/Edit Idea</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><button id="logoutBtn" class="dropdown-item" type="button">Sign Out</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container bb-shell pt-3 pb-4">
    <header class="mb-3">
      <h2 class="h5 mb-1">Admin Page</h2>
      <p class="bb-muted mb-0">Inspect browser storage and derived user info. Remove individual keys or clear entire storage scopes.</p>
    </header>

    <section class="card mb-3">
      <div class="card-body">
        <h3 class="h6 mb-2">Derived User Data</h3>
        <div id="derivedInfo" class="bb-admin-grid"></div>
      </div>
    </section>

    <div class="row g-3">
      <div class="col-12 col-lg-6">
        <section class="card h-100">
          <div class="card-header d-flex justify-content-between align-items-center gap-2">
            <h3 class="h6 mb-0">localStorage</h3>
            <button id="clearLocalAllBtn" type="button" class="btn btn-sm btn-outline-danger">Clear All Local</button>
          </div>
          <div class="card-body">
            <div id="localStorageList" class="vstack gap-2"></div>
          </div>
        </section>
      </div>

      <div class="col-12 col-lg-6">
        <section class="card h-100">
          <div class="card-header d-flex justify-content-between align-items-center gap-2">
            <h3 class="h6 mb-0">sessionStorage</h3>
            <button id="clearSessionAllBtn" type="button" class="btn btn-sm btn-outline-danger">Clear All Session</button>
          </div>
          <div class="card-body">
            <div id="sessionStorageList" class="vstack gap-2"></div>
          </div>
        </section>
      </div>
    </div>

    <section class="card mt-3">
      <div class="card-header d-flex justify-content-between align-items-center gap-2">
        <h3 class="h6 mb-0">Saved Content Snapshot</h3>
        <button id="resetFromJsonBtn" type="button" class="btn btn-sm btn-outline-primary">Reload from Internal JSON</button>
      </div>
      <div class="card-body">
        <pre id="contentRecordsPreview" class="bb-admin-pre mb-0"></pre>
      </div>
    </section>
  </main>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Shared Auth Guard -->
  <script src="../assets/js/auth-guard.js"></script>

  <!-- Admin JS -->
  <script src="../assets/js/admin.js"></script>
</body>

</html>
