<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Normalize -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">

  <title>Data Form</title>
</head>

<body class="bb-idea-form-page">
  <main class="container-fluid bb-idea-form-wrap">
    <section class="card bb-idea-form-card">
      <a href="../index.html" class="bb-form-close" aria-label="Close Add Idea">
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </a>

      <div class="card-body p-3">
        <div class="bb-idea-form-head mb-3">
          <h1 class="h5 mb-1"><i class="bi bi-lightbulb me-1" aria-hidden="true"></i>Add Idea</h1>
          <p class="bb-muted mb-0">Capture a concise idea record and save it to your board.</p>
        </div>

        <form id="idea-form" novalidate>
          <div class="row g-2">
            <div class="col-12 col-lg-4">
              <section class="bb-form-panel bb-form-panel-primary h-100">
                <h2 class="bb-panel-title mb-2"><i class="bi bi-card-heading me-1" aria-hidden="true"></i>Core Info</h2>
                <div class="row g-2">
                  <div class="col-12">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" id="title" name="title" class="form-control" placeholder="Idea title" required>
                  </div>
                  <div class="col-12">
                    <label for="tagline" class="form-label">Tagline</label>
                    <input type="text" id="tagline" name="tagline" class="form-control" placeholder="Short hook line">
                  </div>
                  <div class="col-12">
                    <label for="author" class="form-label">Author</label>
                    <input type="text" id="author" name="author" class="form-control" required>
                  </div>
                  <div class="col-12">
                    <div class="input-group bb-inline-label-group">
                      <span class="input-group-text">Created</span>
                      <input type="datetime-local" id="createdAtDisplay" class="form-control" disabled>
                    </div>
                  </div>
                  <div class="col-12">
                    <div class="input-group bb-inline-label-group">
                      <span class="input-group-text">Modified</span>
                      <input type="datetime-local" id="modifiedAtDisplay" class="form-control" disabled>
                    </div>
                  </div>
                </div>
              </section>
            </div>

            <div class="col-12 col-lg-4">
              <section class="bb-form-panel bb-form-panel-userstory h-100">
                <h2 class="bb-panel-title mb-2"><i class="bi bi-chat-quote me-1" aria-hidden="true"></i>User Story</h2>
                <div class="vstack gap-2">
                  <div class="bb-story-row">
                    <label class="bb-story-label" for="userStoryAsA">As a</label>
                    <input type="text" id="userStoryAsA" class="form-control" placeholder="type of user">
                  </div>
                  <div class="bb-story-row">
                    <label class="bb-story-label" for="userStoryIWant">I want</label>
                    <input type="text" id="userStoryIWant" class="form-control" placeholder="goal/action">
                  </div>
                  <div class="bb-story-row">
                    <label class="bb-story-label" for="userStorySoThat">So that</label>
                    <input type="text" id="userStorySoThat" class="form-control" placeholder="benefit/outcome">
                  </div>
                </div>
              </section>
            </div>

            <div class="col-12 col-lg-4">
              <section class="bb-form-panel bb-form-panel-secondary h-100">
                <h2 class="bb-panel-title mb-2"><i class="bi bi-file-text me-1" aria-hidden="true"></i>Narrative</h2>
                <label for="narrative" class="form-label">Narrative</label>
                <textarea id="narrative" name="narrative" class="form-control" rows="7" placeholder="Short description of this idea" required></textarea>
              </section>
            </div>

            <div class="col-12 col-lg-6">
              <section class="bb-form-panel bb-form-panel-tertiary">
                <h2 class="bb-panel-title mb-2"><i class="bi bi-tags me-1" aria-hidden="true"></i>Tags</h2>
                <label for="tagsInput" class="form-label">Tags</label>
                <input type="text" id="tagsInput" name="tagsInput" class="form-control" placeholder="ui, auth, api">
                <div class="form-text">Separate each tag with a comma.</div>
              </section>
            </div>

            <div class="col-12 col-lg-6">
              <section class="bb-form-panel bb-form-panel-links">
                <h2 class="bb-panel-title mb-2"><i class="bi bi-link-45deg me-1" aria-hidden="true"></i>Links</h2>
                <div id="linksContainer" class="vstack gap-2" aria-live="polite"></div>
                <div class="d-flex justify-content-between align-items-center mt-2">
                  <div class="form-text mb-0">URL first, then description, then type. Add as many links as needed.</div>
                  <button type="button" id="addLink" class="btn btn-outline-primary btn-sm">
                    <i class="bi bi-plus-circle me-1" aria-hidden="true"></i>Add Link
                  </button>
                </div>
              </section>
            </div>
          </div>

          <div class="bb-form-actions mt-4">
            <button type="submit" class="btn btn-lg bb-save-idea-btn">
              <i class="bi bi-lightbulb me-1" aria-hidden="true"></i>Save Idea
            </button>
            <button type="reset" class="btn btn-outline-secondary btn-lg">Reset</button>
          </div>
        </form>

        <datalist id="linkTypeOptions">
          <option value="img"></option>
          <option value="repo"></option>
          <option value="app"></option>
          <option value="idea"></option>
          <option value="resource"></option>
          <option value="article"></option>
          <option value="video"></option>
          <option value="doc"></option>
        </datalist>
      </div>
    </section>
  </main>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Shared Auth Guard -->
  <script src="../assets/js/auth-guard.js"></script>

  <!-- Form JS -->
  <script src="../assets/js/form.js"></script>

</body>

</html>
